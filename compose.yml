services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: supplytrace
      POSTGRES_PASSWORD: ${PART3_DB_PASSWORD:-supplytrace}
      POSTGRES_DB: supplytrace_part3
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - part3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplytrace -d supplytrace_part3"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://supplytrace:${PART3_DB_PASSWORD:-supplytrace}@postgres:5432/supplytrace_part3
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_API_BASE: ""
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend

volumes:
  part3_pgdata:
